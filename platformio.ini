; PlatformIO Project Configuration File
;
; CYD_AnimatedPixelClock - animated retro-arcade pixel clock for the ESP32
; "Cheap Yellow Display" family.
;
; Ported from AnimatedPixelClock by Keralots, which targeted an ESP32-S3 driving
; two chained 64x64 HUB75 RGB matrix panels (a 128x64 canvas). See README.md.
;
; ---- Rendering model -------------------------------------------------------
; The clock styles draw into an off-screen RGB565 canvas of CANVAS_WIDTH x
; CANVAS_HEIGHT logical pixels. Each logical pixel is painted as a
; DISPLAY_SCALE x DISPLAY_SCALE block when the frame is pushed to the TFT, so
; the chunky pixel-art look survives on an LCD. Canvas x scale is chosen per
; board to fill the panel exactly - no letterboxing on either target.
;
;   esp32-cyd-24   160x120 @ 2x  ->  320x240   (ILI9341)
;   esp32-cyd-28   160x120 @ 2x  ->  320x240   (ILI9341)
;   esp32-cyd-40   240x160 @ 2x  ->  480x320   (ST7796S)
;
; Animation code addresses SCREEN_WIDTH / SCREEN_HEIGHT (= the canvas), never
; raw panel pixels, so a new board is a new env rather than a code change.

[platformio]
name        = CYD_AnimatedPixelClock
description = Animated retro-arcade pixel clock - ESP32 CYD (ILI9341 / ST7796S)
default_envs = esp32-cyd-28

; ============================ Shared settings ==============================
[common]
; Pinned deliberately. The upstream source targets the arduino-esp32 2.x API
; (notably esp_task_wdt_init(timeout, panic)). Left unpinned, `espressif32`
; resolves to the pioarduino 55.x fork (arduino-esp32 3.x) and the build fails.
; 6.12.0 == arduino-esp32 2.0.17.
platform      = espressif32@6.12.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
board_build.partitions = partitions_custom.csv

lib_deps =
	bodmer/TFT_eSPI@^2.4.76
	https://github.com/PaulStoffregen/XPT2046_Touchscreen
	adafruit/Adafruit GFX Library@^1.12.4
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.4.2
	ricmoo/QRCode@^0.0.1
	; Improv-Serial in-browser WiFi provisioning over the CP2102.
	; Stripped from the build when IMPROV_SETUP_ENABLED = 0 in include/config.h.
	jnthas/Improv WiFi Library@^0.0.2

; Flags common to both boards. Display driver, geometry, backlight GPIO and SPI
; speed are board-specific and set per env below.
build_flags_shared =
	-DUSER_SETUP_LOADED=1
	; ---- TFT_eSPI display SPI (identical on all CYD variants) ----
	; USE_HSPI_PORT is REQUIRED, not an optimisation. Without it TFT_eSPI uses
	; VSPI, which is the same peripheral the XPT2046 touch driver claims - two
	; drivers on one bus at 55MHz and 2.5MHz, which shows up as touch working
	; intermittently and then not at all as the draw pattern changes.
	; It is also the correct port: MOSI 13 / MISO 12 / SCLK 14 / CS 15 are
	; HSPI's native pins, so the display gets direct hardware mapping instead
	; of being routed through the GPIO matrix.
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BACKLIGHT_ON=HIGH
	; ---- Fonts. VLW smooth fonts only; no built-in GLCD in production UI ----
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_READ_FREQUENCY=20000000
	; ---- Touch: XPT2046 is driven by XPT2046_Touchscreen on its own VSPI
	;      instance (see src/touch/touch.cpp), NOT by TFT_eSPI. TOUCH_CS is
	;      deliberately left undefined so TFT_eSPI does not also claim the chip.
	; ---- Project ----
	-DDEBUG_LEVEL=3
	-DCORE_DEBUG_LEVEL=0

; ================= CYD 2.8" - ESP32-2432S028R - ILI9341 ====================
; The reference target. 320x240 landscape, backlight on GPIO 21.
[env:esp32-cyd-28]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps      = ${common.lib_deps}
build_flags =
	${common.build_flags_shared}
	-DBOARD_CYD_28=1
	-DILI9341_DRIVER=1
	; Panel geometry as TFT_eSPI sees it (portrait native; rotated in initDisplay)
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_BL=21
	-DSPI_FREQUENCY=55000000
	-DSPI_TOUCH_FREQUENCY=2500000
	; Sprite magnification. Character art is fixed 8x10-ish pixel work; drawn 1:1
	; against these digits it reads as tiny. Defaults to half the digit text size,
	; which matches the proportion upstream had. Set 1 for the original 1:1 art,
	; or raise it if the characters still look small.
	;-DSPRITE_SCALE=2
	; Logical canvas: 160x120 at 2x = exactly 320x240
	-DCANVAS_WIDTH=160
	-DCANVAS_HEIGHT=120
	-DDISPLAY_SCALE=2

; ================= CYD 2.4" - ESP32-2432S024 - ILI9341 =====================
; Same 320x240 panel as the 2.8", so the canvas and every clock layout are
; identical - this env exists to hold the differences, not the geometry.
;
; UNVERIFIED, and two things vary by board revision. Check these first:
;
;  1. Display driver. ILI9341 is assumed. Some 2.4" modules ship an ST7789
;     instead; a garbled, shifted or blank screen is the symptom. Swap
;     -DILI9341_DRIVER=1 for -DST7789_DRIVER=1 if so. Red and blue swapped
;     instead means the driver is right and the panel is BGR - add
;     -DTFT_RGB_ORDER=TFT_BGR.
;
;  2. Touch controller. The "R" boards fit a resistive XPT2046 and work as-is.
;     The "C" boards fit a capacitive CST820 on I2C, which is not supported -
;     set HAS_RESISTIVE_TOUCH=0 below so the driver never claims those GPIOs.
;     Symptom of a C board left at 1: tapping does nothing (harmless, but the
;     pins are being driven wrongly).
[env:esp32-cyd-24]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps      = ${common.lib_deps}
build_flags =
	${common.build_flags_shared}
	-DBOARD_CYD_28=1
	-DILI9341_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_BL=21
	-DSPI_FREQUENCY=55000000
	-DSPI_TOUCH_FREQUENCY=2500000
	; Set to 0 on a capacitive ("C") board - see note above.
	-DHAS_RESISTIVE_TOUCH=1
	; Sprite magnification. Character art is fixed 8x10-ish pixel work; drawn 1:1
	; against these digits it reads as tiny. Defaults to half the digit text size,
	; which matches the proportion upstream had. Set 1 for the original 1:1 art,
	; or raise it if the characters still look small.
	;-DSPRITE_SCALE=2
	; Logical canvas: 160x120 at 2x = exactly 320x240
	-DCANVAS_WIDTH=160
	-DCANVAS_HEIGHT=120
	-DDISPLAY_SCALE=2

; ================= CYD 4.0" - ESP32-2432S040 - ST7796S =====================
; 480x320 landscape, backlight on GPIO 27, slower SPI, BGR colour order.
[env:esp32-cyd-40]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps      = ${common.lib_deps}
build_flags =
	${common.build_flags_shared}
	-DBOARD_CYD_40=1
	-DST7796_DRIVER=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	; Verified on the 4.0" board: panel is wired BGR, not RGB.
	-DTFT_RGB_ORDER=TFT_BGR
	; Backlight moves to GPIO 27 on this board (GPIO 21 on the 2.8").
	-DTFT_BL=27
	-DSPI_FREQUENCY=27000000
	-DSPI_TOUCH_FREQUENCY=2500000
	; Sprite magnification. Character art is fixed 8x10-ish pixel work; drawn 1:1
	; against these digits it reads as tiny. Defaults to half the digit text size,
	; which matches the proportion upstream had. Set 1 for the original 1:1 art,
	; or raise it if the characters still look small.
	;-DSPRITE_SCALE=2
	; Logical canvas: 240x160 at 2x = exactly 480x320
	-DCANVAS_WIDTH=240
	-DCANVAS_HEIGHT=160
	-DDISPLAY_SCALE=2
